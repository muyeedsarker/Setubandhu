name: Build Setubandhu APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # স্থায়ী চাবি (GitHub Secrets থেকে): প্রতিবার একই সই, তাই পুরনো অ্যাপের ওপর আপডেট বসে
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/setubandhu.keystore"
            {
              echo "storeFile=setubandhu.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEYSTORE_PASSWORD"
            } > "$GITHUB_WORKSPACE/keystore.properties"
          else
            # Secrets দেওয়া না থাকলে অস্থায়ী চাবি (প্রতিবার নতুন, তাই আপডেটের আগে পুরনো অ্যাপ মুছতে হয়)
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/setubandhu-ci.keystore" \
              -alias setubandhu-ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass changeit -keypass changeit \
              -dname "CN=Setubandhu, OU=Mobile, O=Setubandhu, L=Gazipur, ST=Dhaka, C=BD"
            {
              echo "storeFile=setubandhu-ci.keystore"
              echo "storePassword=changeit"
              echo "keyAlias=setubandhu-ci"
              echo "keyPassword=changeit"
            } > "$GITHUB_WORKSPACE/keystore.properties"
          fi

      - name: Build signed Release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Setubandhu-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
