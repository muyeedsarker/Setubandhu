name: Build Setubandhu APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Create temporary signing key for installable APK
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/setubandhu-ci.keystore" \
            -alias setubandhu-ci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass changeit -keypass changeit \
            -dname "CN=Setubandhu, OU=Mobile, O=Setubandhu, L=Gazipur, ST=Dhaka, C=BD"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<'PROPS'
          storeFile=setubandhu-ci.keystore
          storePassword=changeit
          keyAlias=setubandhu-ci
          keyPassword=changeit
          PROPS

      - name: Build signed Release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Setubandhu-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
